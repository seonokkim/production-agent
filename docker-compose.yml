services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: production
      POSTGRES_PASSWORD: production
      POSTGRES_DB: production_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production -d production_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
