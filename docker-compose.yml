services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: production
      POSTGRES_PASSWORD: production
      POSTGRES_DB: production_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production -d production_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional P1.5 — local n8n for Asset Review Automation (not on ComfyUI path).
  #   docker compose --profile ops up -d n8n
  n8n:
    profiles: ["ops"]
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
      GENERIC_TIMEZONE: Asia/Seoul
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
